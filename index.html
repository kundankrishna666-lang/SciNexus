<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciNexus - Open Research Repository</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🔬 SciNexus Hub</h1>
        <div id="auth-status" class="text-sm font-medium">चेक हो रहा है...</div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        
        <!-- Login / Signup Section -->
        <div id="auth-section" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">खाता बनाएं या लॉगिन करें</h2>
            <input type="email" id="email" placeholder="अपना ईमेल दर्ज करें" class="w-full p-2 border rounded mb-3 text-sm">
            <input type="password" id="password" placeholder="पासवर्ड दर्ज करें" class="w-full p-2 border rounded mb-4 text-sm">
            <div class="flex flex-wrap gap-2">
                <button onclick="signUp()" class="bg-blue-500 text-white px-4 py-2 rounded text-sm hover:bg-blue-600">साइन अप करें</button>
                <button onclick="login()" class="bg-green-500 text-white px-4 py-2 rounded text-sm hover:bg-green-600">लॉगिन करें</button>
                <button onclick="logout()" id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded text-sm hidden hover:bg-red-600">लॉग आउट</button>
            </div>
        </div>

        <!-- My Library Section -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">📚 मेरी लाइब्रेरी (My Cloud Library)</h2>
            
            <!-- Paper Add Form -->
            <div class="mb-4 p-4 bg-gray-50 rounded border">
                <h3 class="font-medium text-sm mb-2 text-gray-600">नया रिसर्च पेपर जोड़ें</h3>
                <input type="text" id="paper-title" placeholder="पेपर का टाइटल (Title)" class="w-full p-2 border rounded mb-2 text-sm">
                <input type="text" id="paper-authors" placeholder="लेखक (Authors)" class="w-full p-2 border rounded mb-2 text-sm">
                <button onclick="savePaper()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700">लाइब्रेरी में सेव करें</button>
            </div>

            <!-- Saved Papers List -->
            <div id="papers-list" class="space-y-2">
                <p class="text-gray-500 text-sm">पेपर्स लोड हो रहे हैं...</p>
            </div>
        </div>

    </main>

    <!-- Firebase Configuration & Logic Script -->
    <script>
        // आपका असली Firebase Config (जो आपने भेजा है)
        const firebaseConfig = {
            apiKey: "AIzaSyC93VoM3Vq2hbnF9S6DojMJIMEtkUukU-g",
            authDomain: "scinexus-1f5d1.firebaseapp.com",
            projectId: "scinexus-1f5d1",
            storageBucket: "scinexus-1f5d1.firebasestorage.app",
            messagingSenderId: "701649637520",
            appId: "1:701649637520:web:afae596028cbca4c884815",
            measurementId: "G-3K4FM9LCH8"
        };

        // Firebase Initialize करें
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Elements
        const authStatus = document.getElementById('auth-status');
        const logoutBtn = document.getElementById('logout-btn');
        const papersList = document.getElementById('papers-list');

        // Auth State Monitor (देखें कि यूज़र लॉगिन है या नहीं)
        auth.onAuthStateChanged((user) => {
            if (user) {
                authStatus.innerText = `लॉगिन हैं: ${user.email}`;
                logoutBtn.classList.remove('hidden');
                loadMyPapers(user.uid);
            } else {
                authStatus.innerText = "लॉगिन नहीं हैं";
                logoutBtn.classList.add('hidden');
                papersList.innerHTML = `<p class="text-red-500 text-sm">कृपया ऊपर अपने अकाउंट से लॉगिन करें ताकि आपकी लाइब्रेरी दिख सके।</p>`;
            }
        });

        // Sign Up Function
        function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) {
                alert("कृपया ईमेल और पासवर्ड भरें।");
                return;
            }
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => alert("खाता सफलतापूर्वक बन गया और लॉगिन हो गए!"))
                .catch((err) => alert("एरर: " + err.message));
        }

        // Login Function
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) {
                alert("कृपया ईमेल और पासवर्ड भरें।");
                return;
            }
            auth.signInWithEmailAndPassword(email, password)
                .then(() => alert("लॉगिन सफल रहा!"))
                .catch((err) => alert("लॉगिन फेल: " + err.message));
        }

        // Logout Function
        function logout() {
            auth.signOut().then(() => alert(" सफलतापूर्वक लॉग आउट हो गए हैं।"));
        }

        // Save Paper to Firestore Cloud Database
        function savePaper() {
            const user = auth.currentUser;
            if (!user) {
                alert("कृपया पहले लॉगिन करें!");
                return;
            }

            const title = document.getElementById('paper-title').value;
            const authors = document.getElementById('paper-authors').value;

            if (!title) {
                alert("कृपया पेपर का टाइटल लिखें।");
                return;
            }

            db.collection("papers").add({
                userId: user.uid,
                title: title,
                authors: authors,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("पेपर आपकी क्लाउड लाइब्रेरी में सेव हो गया!");
                document.getElementById('paper-title').value = '';
                document.getElementById('paper-authors').value = '';
                loadMyPapers(user.uid);
            })
            .catch((err) => alert("सेव करने में एरर: " + err.message));
        }

        // Load Saved Papers from Firestore Cloud Database
        function loadMyPapers(uid) {
            db.collection("papers")
              .where("userId", "==", uid)
              .onSnapshot((snapshot) => {
                papersList.innerHTML = "";
                if (snapshot.empty) {
                    papersList.innerHTML = `<p class="text-gray-500 text-sm">आपकी लाइब्रेरी अभी खाली है। ऊपर फॉर्म से पेपर जोड़ें।</p>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const paper = doc.data();
                    papersList.innerHTML += `
                        <div class="p-3 bg-gray-50 border rounded flex justify-between items-center shadow-sm">
                            <div>
                                <h4 class="font-bold text-sm text-blue-900">${paper.title}</h4>
                                <p class="text-xs text-gray-600">लेखक: ${paper.authors || 'अज्ञात'}</p>
                            </div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Error loading papers:", error);
                papersList.innerHTML = `<p class="text-red-500 text-sm">डेटा लोड करने में समस्या आई। सुनिश्चित करें कि Firestore Database इनेबल है।</p>`;
            });
        }
    </script>
</body>
</html>
